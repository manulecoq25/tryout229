<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPet360 — Soin complet pour votre animal au Bénin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --night:#0E1810;--forest:#1A3324;--pine:#2D5C3F;--fern:#4A8A5E;--sage:#7DB890;
  --mist:#C3DCC9;--foam:#EAF4EC;--linen:#F8F3EB;--cream:#FDF9F3;
  --gold:#C9933A;--amber:#E6B44E;--butter:#FAE8B0;
  --sienna:#B85A36;--blush:#F2DDD3;--white:#FEFEFE;
  --g1:#F0F2F0;--g2:#D8DDD8;--g3:#8C978C;--g4:#4A574A;
  --t1:#141F14;--t2:#3D4E3D;--t3:#7A8A7A;--t4:#A8B8A8;
  --r:18px;--r2:26px;--r3:40px;
  --sh:0 2px 16px rgba(14,24,16,.07);
  --sh2:0 8px 40px rgba(14,24,16,.13);
  --sh3:0 24px 80px rgba(14,24,16,.22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Cabinet Grotesk',sans-serif;background:var(--cream);color:var(--t1);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--g1);}::-webkit-scrollbar-thumb{background:var(--g2);border-radius:3px;}
.page{display:none;animation:pageIn .42s cubic-bezier(.25,.46,.45,.94) both;}
.page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="page active" id="page-home">
<h1>MyPet360 Demo</h1>
<p>Your pet care platform is loading...</p>
</div>
</body>
</html>
